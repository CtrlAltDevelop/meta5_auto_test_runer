;--------------------------------------------------
; Tester Inputs Section
;--------------------------------------------------
[TesterInputs]
; Enter inputs was not in entry file (example: ATR_PERIOD = 14)
; ATR indicator multiplier used in the EA
ATR_IND=1

; ATR period for calculating the indicator
ATR_PERIOD=14

; Some EA-specific parameter (e.g., “ff”)
ff=3

; RSI floor level for the EA
RSI_Floor=40

; Another EA-specific parameter (e.g., “candle2”)
candle2=2

; Example symbol prefix if needed for some brokers (e.g., “m.” or “_TEST”)
InpSymbolPrefix=-CUSTOM

; Risk-free index (example parameter)
RiskFreeIndex=.4

; Risk-reward ratio
Inp_RewardToRisk=2.9

; Trade mode (e.g., 0 = market, 1 = pending)
Inp_Trade_Mode=0

; Percentage difference for pending order from current price
Inp_CurrentPrice_Ext_DiffPercent_PendingOrder=90

; Number of candles until a pending order expires
Inp_NO_Of_CandlesExpire_PendingOrder=50

; Take Profit (TP) mode (e.g., 0 = enum1, 1 = enum2)
