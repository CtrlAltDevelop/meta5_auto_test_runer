; Number of previous candles for calculating TP
Inp_NO_Of_previousCandles_For_TP=200

; Percentage (of candle size or some reference) for TP calculation
Inp_HighOrLow_Percent_For_TP=90.0

; Whether to check if SL/TP is inside or outside the pending order after a trigger
Inp_Check_TrigerCandle_If_SL_TP_Inside_PendingOrder=true

; Max percent of orders considered "unacceptable" (example parameter)
Inp_MaxPercent_Of_Unacceptable_PendingOrders=20.0

; Switch for Train (0) vs Test (1) mode in the EA
Inp_Train_or_Test=0

; Specific year for testing (example input)
Inp_Test_Year=2013

; Another example parameter for trade timeframe 
; (possibly H1, H4, etc., by integer code).
Inp_TradeTimeFrame=16388

